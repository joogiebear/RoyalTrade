name: RoyalTrade
version: ${version}
main: com.mystipixel.royaltrade.RoyalTradePlugin
api-version: '26.2'
author: Mystipixel
description: Player-to-player trading that cannot be changed after both sides agree.
# Vault provides the money half; without it items still trade and coins are refused.
# EconGuard, when present, receives every completed trade.
# RoyalSkyblock, when present, saves both players' profiles after each completed trade.
softdepend:
  - Vault
  - EconGuard
  - RoyalSkyblock
commands:
  trade:
    description: Trade with another player.
    usage: /trade <player>
permissions:
  royaltrade.trade:
    description: Use /trade.
    default: true
  royaltrade.admin:
    description: Reload RoyalTrade.
    default: op
