# RoyalTrade configuration
#
# The trade protections (any change clears both confirmations, a frozen settle
# window, crash-safe escrow) are always on. What you can tune is below.

# Seconds the trade stays frozen after both sides confirm, before it completes.
# Players see a countdown. 0 completes immediately (not recommended).
settle-seconds: 3

# Seconds after either offer changes before anyone can confirm, so a click
# already in flight can't confirm the new terms. Minimum 1.
confirm-delay-seconds: 2

# How long a trade request stays open before it expires.
request-expiry-seconds: 60

# Minimum gap between one player's trade requests, so /trade cannot be used to
# spam someone's chat.
request-cooldown-seconds: 5

# Refuse trades between players in different worlds.
same-world-only: true

# Maximum distance in blocks. -1 disables the check.
max-distance: -1

# Items that may never be offered in a trade. Entries are material names
# (DRAGON_EGG) or eco-item ids (ecoitems:soulbound_blade). Shulker boxes,
# bundles and other containers are searched too.
blocked-items: []
#  - DRAGON_EGG
#  - ecoitems:soulbound_blade

# Refuse trades involving an account with less than this much playtime, in hours.
# Makes throwaway alts cost something, but also blocks new players. 0 disables.
min-playtime-hours: 0
